---
# installs prometheus-pve-exporter on each pve-exporter-* ct created by
# infra/pve_exporter.tf. the proxmox api token it needs is written to vault
# by that same tf (pvekv/prometheus-pve-exporter) -- run `tofu apply` there
# first or this has nothing to read.
- name: prometheus-pve-exporter
  hosts: pve_exporter
  become: yes

  tasks:
    - name: install venv deps
      ansible.builtin.apt:
        name:
          - python3-venv
          - python3-pip
        state: present
        update_cache: true

    - name: create venv and install exporter
      ansible.builtin.pip:
        name: prometheus-pve-exporter
        virtualenv: /opt/pve-exporter
        virtualenv_command: python3 -m venv

    - name: fetch proxmox api token from vault
      ansible.builtin.set_fact:
        pve_exporter_config: "{{ lookup('community.hashi_vault.vault_kv1_get', 'prometheus-pve-exporter', engine_mount_point='pvekv').secret['pve.yml'] }}"
      no_log: true

    - name: write pve.yml
      ansible.builtin.copy:
        content: "{{ pve_exporter_config }}"
        dest: /opt/pve-exporter/pve.yml
        owner: root
        mode: "0600"
      no_log: true
      notify: restart pve-exporter

    - name: install systemd unit
      ansible.builtin.template:
        src: templates/pve-exporter.service.j2
        dest: /etc/systemd/system/pve-exporter.service
      notify: restart pve-exporter

    - name: enable pve-exporter
      ansible.builtin.systemd:
        name: pve-exporter
        state: started
        enabled: true
        daemon_reload: true

  handlers:
    - name: restart pve-exporter
      ansible.builtin.systemd:
        name: pve-exporter
        state: restarted
        daemon_reload: true
