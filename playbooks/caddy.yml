---
- hosts: hurley.r.ss,oca0,edge.r.ss
  become: yes
  roles:
    - role: caddy_ansible.caddy_ansible
      caddy_setcap: true
      caddy_systemd_capabilities_enabled: true
      caddy_systemd_capabilities: "CAP_NET_BIND_SERVICE"
      caddy_packages:
      - github.com/caddy-dns/digitalocean@master
      caddy_config: "{{ lookup('template', 'templates/' + (caddy_template | default(ansible_hostname)) + '/Caddyfile.j2') }}"
      caddy_environment_variables:
        CADDY_ADMIN: "{{ caddy_admin_listen | default('100.91.128.97:2019') }}"
