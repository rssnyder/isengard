all:
  vars:
    scrape: 120s
    arch: amd64
    ansible_user: riley
    host_key_checking: false
  ansible_ssh_extra_args0: '-o StrictHostKeyChecking=no'
  children:
    hypervisor:
      vars:
        ansible_user: root
      hosts:
        poweredge:
          ansible_host: 192.168.2.12
        pve0:
          ansible_host: 192.168.2.69
        pve1:
          ansible_host: 192.168.2.11
        pve2:
          ansible_host: 192.168.2.246
    pve_exporter:
      vars:
        ansible_user: root
      hosts:
        pve-exporter-poweredge.r.ss:
        pve-exporter-pve0.r.ss:
        pve-exporter-pve1.r.ss:
        pve-exporter-pve2.r.ss:
    pve:
      hosts:
        home.r.ss:
          tailscale_args: --advertise-exit-node 
        prometheus.r.ss:
        emma.r.ss:
        bao.r.ss:
        cornelius.r.ss:
        plex.r.ss:
        polk.r.ss:
        git.r.ss:
        torterra.r.ss:
        actions.r.ss:
          forgejo_tags: ["amd64", "x86", "pve"]
        span.r.ss:
        wg0.r.ss:
        edge.r.ss:
          # serve hurley's caddyfile verbatim so the two are comparable
          caddy_template: hurley
          # hurley's CADDY_ADMIN is its own tailscale ip; edge has to bind its own
          caddy_admin_listen: 127.0.0.1:2019
    local:
      hosts:
        hurley.r.ss:
          arch: arm64
        ben.r.ss:
        baelor.r.ss:
        spark.r.ss:
          ansible_user: rssnyder
    remote:
      hosts:
        knapp:
          ansible_host: knapp.tail1e5ed.ts.net
          docker_apt_arch: arm64
          docker_users:
            - riley
            - hunter
        winterfell:
          ansible_host: winterfell.tail1e5ed.ts.net
          forgejo_tags: ["arm64", "aarch64", "asahi", "laptop"]
        saywer:
    oc:
      vars:
        ansible_user: ubuntu
        iptables: true
        arch: arm64
        extra_dst_args: -frequency=60 -redisAddress="oca0:6379"
        docker_apt_arch: arm64
        docker_users:
        - riley
        tailscale_args: "--reset"
      hosts:
        oca0:
          # ansible_host: 129.146.149.166
          cluster_context: oc
        oca1:
          ansible_host: 129.153.217.210
        oca2:
          ansible_host: 158.101.27.222
        oca3:
          ansible_host: 144.24.58.138
        oca8:
          ansible_host: oca8.rileysnyder.dev
