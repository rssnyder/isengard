apiVersion: v1
kind: Namespace
metadata:
  name: csi-proxmox
  labels:
    # Cluster default PodSecurity enforce level is "baseline", which blocks
    # the node plugin's required privileged/SYS_ADMIN/hostPath access (needed
    # to format, mount, and bind volumes on the host). CSI driver namespaces
    # are a standard exception to PSA enforcement.
    pod-security.kubernetes.io/enforce: privileged

---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: sergelogvinov
  namespace: csi-proxmox
spec:
  interval: 5m
  url: oci://ghcr.io/sergelogvinov/charts
  type: "oci"

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: proxmox-csi
  namespace: csi-proxmox
spec:
  interval: 10m
  timeout: 5m
  chart:
    spec:
      chart: proxmox-csi-plugin
      version: "0.5.4"
      sourceRef:
        kind: HelmRepository
        name: sergelogvinov
      interval: 5m
  values:
    existingConfigSecret: proxmox-csi
    storageClass:
      - name: proxmox
        storage: data
        ssd: true
        reclaimPolicy: Retain
        fstype: ext4
      - name: proxmox-nfs
        storage: baelor
        ssd: false
        reclaimPolicy: Retain
        fstype: xfs
    node:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              # proxmox-cloud-controller-manager labels nodes with its own
              # vendor-prefixed topology keys, not the generic
              # topology.kubernetes.io/*. The generic key never matched here,
              # so the node DaemonSet had 0 desired pods, the CSI driver never
              # registered in CSINode, and GetCapacity was never reachable —
              # which made the scheduler treat every node as having no free
              # storage for any PVC on the proxmox/proxmox-nfs StorageClasses.
              - key: topology.proxmox.sinextra.dev/region
                operator: Exists
        # Define the storage class as default
        # annotations:
        #   storageclass.kubernetes.io/is-default-class: "true"
